name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: UI install
        working-directory: ui
        run: npm ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # Releases are unsigned. To sign, add a code-signing step here (e.g. Azure Trusted
      # Signing or signtool on the built exe/installer) before packaging the assets below.
      - name: Build
        run: cargo tauri build

      - name: Zip the executable
        shell: pwsh
        run: Compress-Archive -Path target/release/limitrings.exe -DestinationPath limitrings-windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            limitrings-windows-x64.zip
