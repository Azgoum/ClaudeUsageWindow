[workspace]
members = ["crates/limits-core", "app"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true

# Local measurement only: enables the dev switches (LIMITRINGS_*) in an optimized build.
# Never distribute.
[profile.measure]
inherits = "release"
debug-assertions = true
