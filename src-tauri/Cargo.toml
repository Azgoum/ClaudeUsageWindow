[package]
name = "limitrings-tauri"
version = "0.1.0"
description = "Claude Limit Checker: unofficial claude.ai usage widget"
edition = "2021"

[lib]
name = "limitrings_lib"

[[bin]]
name = "limitrings"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
limits-core = { path = "../crates/limits-core" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
sys-locale = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
file-rotate = "0.7"
winreg = "0.55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
